<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chat WebSocket</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #decdf8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h2 {
            color: #793d96;
        }

        #chat {
            width: 400px;
            height: 300px;
            background-color: #ede4fb;
            border: 1px solid #ede4fb;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
        }

        #chat div {
            padding: 5px;
            margin-bottom: 5px;
            border-bottom: 1px solid #eee;
            word-break: break-word;
        }

        input[type="text"] {
            width: 300px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }

        button {
            padding: 10px 15px;
            background-color: #b273e1;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 5px;
        }

        button:hover {
            background-color: #a958d3;
        }
    </style>
</head>
<body>
        <!-- Título de la página o sección -->
    <h2>CREATIVA</h2>

    <!-- Contenedor donde se mostrarán los mensajes del chat -->
    <div id="chat"></div>

    <!-- Contenedor del campo de texto y botón para enviar mensajes -->
    <div>
        <!-- Campo de entrada de texto para escribir el mensaje -->
        <input type="text" id="msgInput" placeholder="Escribe tu mensaje..." />
        
        <!-- Botón que al hacer clic llama a la función send() para enviar el mensaje -->
        <button onclick="send()">Enviar</button>
    </div>

    <script>
        // Obtiene una referencia al div donde se mostrarán los mensajes del chat
        const chat = document.getElementById('chat');

        // Crea un nuevo objeto WebSocket y establece conexión con el servidor en localhost, puerto 8080
        const socket = new WebSocket('ws://localhost:8080');

        // Evento que se dispara cuando el servidor envía un mensaje
        socket.onmessage = (event) => {
            // Agrega el mensaje recibido dentro del div 'chat' como un nuevo div
            chat.innerHTML += `<div>${event.data}</div>`;
            // Desplaza el scroll del div hacia abajo para mostrar el último mensaje
            chat.scrollTop = chat.scrollHeight;
        };

        // Función que se ejecuta para enviar el mensaje al servidor
        function send() {
            // Obtiene el valor (texto) que el usuario escribió en el input
            const msg = document.getElementById('msgInput').value;
            // Verifica que el mensaje no esté vacío ni contenga solo espacios
            if (msg.trim() !== '') {
                // Envía el mensaje al servidor usando WebSocket
                socket.send(msg);
                // Limpia el campo de texto para que el usuario pueda escribir otro mensaje
                document.getElementById('msgInput').value = '';
            }
        }

        // Añade un listener al campo de entrada para detectar cuando el usuario presiona 'Enter'
        document.getElementById('msgInput').addEventListener('keypress', function(e) {
            // Si la tecla presionada es 'Enter', llama a la función send() para enviar el mensaje
            if (e.key === 'Enter') {
                send();
            }
        });
    </script>

</body>
</html>
