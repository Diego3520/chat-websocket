<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chat WebSocket</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #decdf8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h2 {
            color: #793d96;
        }

        #chat {
            width: 400px;
            height: 300px;
            background-color: #ede4fb;
            border: 1px solid #ede4fb;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
        }

        #chat div {
            padding: 5px;
            margin-bottom: 5px;
            border-bottom: 1px solid #eee;
            word-break: break-word;
        }

        input[type="text"] {
            width: 300px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }

        button {
            padding: 10px 15px;
            background-color: #b273e1;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 5px;
        }

        button:hover {
            background-color: #a958d3;
        }
    </style>
</head>
<body>
    <h2>CREATIVA</h2>
    <div id="chat"></div>
    <div>
        <input type="text" id="msgInput" placeholder="Escribe tu mensaje..." />
        <button onclick="send()">Enviar</button>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const socket = new WebSocket('ws://localhost:8080');

        socket.onmessage = (event) => {
            chat.innerHTML += `<div>${event.data}</div>`;
            chat.scrollTop = chat.scrollHeight;
        };

        function send() {
            const msg = document.getElementById('msgInput').value;
            if (msg.trim() !== '') {
                socket.send(msg);
                document.getElementById('msgInput').value = '';
            }
        }
        document.getElementById('msgInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                send();
            }
        });
    </script>
</body>
</html>
